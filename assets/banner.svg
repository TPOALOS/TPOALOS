<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">TPOALOS</title>
  <desc id="d">Small, sharp command-line tools. Pure Python, zero dependencies. 53 tools, over 2,000 tests, MIT licensed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect x="48" y="52" width="6" height="108" rx="3" fill="url(#accent)"/>
  <text x="76" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#f8fafc" letter-spacing="1">TPOALOS</text>
  <text x="78" y="156" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Small, sharp command-line tools. Pure Python, zero dependencies.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">
    <rect x="76" y="190" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.55"/>
    <text x="151" y="217" text-anchor="middle">53 tools</text>
    <rect x="242" y="190" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.55"/>
    <text x="342" y="217" text-anchor="middle">2,000+ tests</text>
    <rect x="458" y="190" width="214" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.55"/>
    <text x="565" y="217" text-anchor="middle">0 dependencies</text>
    <rect x="688" y="190" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.55"/>
    <text x="747" y="217" text-anchor="middle">MIT</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8" opacity="0.9">
    <text x="860" y="96">$ backupcheck /backups --verify</text>
    <text x="860" y="124" fill="#5eead4">OK  newest db.tar.gz, 3.1h ago</text>
    <text x="860" y="160">$ listenwatch --allow 22,443</text>
    <text x="860" y="188" fill="#fca5a5">HIGH tcp *:6379 redis</text>
    <text x="860" y="224">$ exifstrip photo.jpg --strip</text>
  </g>
</svg>
